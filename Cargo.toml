[package]
name = "pumpfun-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.9"
anyhow = "1.0"
base64 = "0.22.1"
borsh = "1.5.7"
bs58 = "0.5"
chrono = "0.4"
env_logger = "0.11.8"
futures-util = "0.3"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.4"
solana-sdk = "2.2.2"
solana-transaction-status = "2.1.16"
tokio = { version = "1.38", features = ["full"] }
tonic = { version = "0.12.3", features = ["tls"] }
yellowstone-grpc-client = "6.0.0"
yellowstone-grpc-proto = "6.0.0"